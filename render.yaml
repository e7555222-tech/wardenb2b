databases:
  - name: warden-db
    plan: free
    databaseName: warden
    user: warden

services:
  - type: web
    name: warden-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warden-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL
        value: admin@warden.demo
      - key: ADMIN_PASSWORD
        value: WardenAdmin2024!
      - key: ADMIN_NAME
        value: Warden Admin
      - key: DEMO_SEED
        value: "true"

  - type: web
    name: warden-frontend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: API_URL
        # After first deploy, update this to your warden-backend Render URL:
        # e.g. https://warden-backend.onrender.com
        value: https://warden-backend.onrender.com
      - key: N8N_WEBHOOK_URL
        value: ""
